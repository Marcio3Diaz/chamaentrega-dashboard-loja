services:
  mysql:
    image: mysql:8.0
    container_name: chamaentrega-mysql-shadow
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chamaentrega
      MYSQL_USER: chamaentrega
      MYSQL_PASSWORD: chamaentrega-dev
      MYSQL_ROOT_PASSWORD: chamaentrega-root-dev
      TZ: UTC
    ports:
      - "127.0.0.1:3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - chamaentrega_mysql_shadow:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pchamaentrega-root-dev --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  chamaentrega_mysql_shadow:
