name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://example.com

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Security audit
        run: npm audit --audit-level=high

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Start production server
        shell: bash
        run: |
          npm run start > /tmp/chamaentrega-next.log 2>&1 &
          echo $! > /tmp/chamaentrega-next.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/chamaentrega-next.log
          exit 1

      - name: Smoke test production server
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const assert = (condition, message) => {
            if (!condition) throw new Error(message)
          }

          const get = async (path) => {
            const response = await fetch('http://127.0.0.1:3000' + path, { redirect:'manual' })
            return response
          }

          const health = await get('/api/health')
          assert(health.ok, 'Healthcheck não respondeu 2xx')
          const healthBody = await health.json()
          assert(healthBody.status === 'ok', 'Healthcheck retornou status inesperado')

          const oversizedBody = JSON.stringify({
            address:'Rua ' + 'x'.repeat(9 * 1024),
          })
          const oversizedStream = new ReadableStream({
            start(controller) {
              controller.enqueue(new TextEncoder().encode(oversizedBody))
              controller.close()
            },
          })
          const oversizedResponse = await fetch(
            'http://127.0.0.1:3000/api/geocode',
            {
              method:'POST',
              headers:{
                'content-type':'application/json',
                'origin':'http://127.0.0.1:3000',
              },
              body:oversizedStream,
              duplex:'half',
            },
          )
          assert(
            oversizedResponse.status === 413,
            'API aceitou payload chunked maior que o limite',
          )

          const robots = await get('/robots.txt')
          assert(robots.ok, 'robots.txt indisponível')
          const robotsBody = await robots.text()
          assert(robotsBody.includes('Sitemap:'), 'robots.txt sem Sitemap')
          assert(
            robotsBody.includes('https://example.com/sitemap.xml'),
            'robots.txt aponta para sitemap incorreto',
          )

          for (const blockedPath of ['/admin','/painel','/login','/cadastro','/api']) {
            assert(
              robotsBody.includes('Disallow: ' + blockedPath),
              'robots.txt não bloqueia ' + blockedPath,
            )
          }

          const sitemap = await get('/sitemap.xml')
          assert(sitemap.ok, 'sitemap.xml indisponível')
          const sitemapBody = await sitemap.text()
          assert(sitemapBody.includes('<urlset'), 'sitemap.xml inválido')
          assert(
            sitemapBody.includes('https://example.com'),
            'sitemap.xml não usa a URL pública configurada',
          )
          assert(
            sitemapBody.includes('https://example.com/privacidade'),
            'sitemap.xml não inclui a página de privacidade',
          )
          assert(
            sitemapBody.includes('https://example.com/termos'),
            'sitemap.xml não inclui a página de termos',
          )

          for (const legalPath of ['/privacidade','/termos']) {
            const legal = await get(legalPath)
            assert(legal.ok, legalPath + ' não respondeu 2xx')
            const legalBody = await legal.text()
            assert(
              legalBody.includes('rel="canonical"')
                && legalBody.includes('https://example.com' + legalPath),
              legalPath + ' está sem canonical público correto',
            )
          }

          const publicImage = await get('/images/chamaentrega-dashboard-banner.webp')
          assert(publicImage.ok, 'Imagem pública WebP não respondeu 2xx')
          assert(
            publicImage.status === 200,
            'Imagem pública WebP sofreu redirecionamento inesperado',
          )
          assert(
            publicImage.headers.get('content-type')?.toLowerCase().includes('image/webp'),
            'Imagem pública WebP retornou Content-Type incorreto',
          )
          assert(
            !publicImage.headers.get('location'),
            'Imagem pública WebP não pode redirecionar para autenticação',
          )
          const publicImageCache = publicImage.headers.get('cache-control')?.toLowerCase() ?? ''
          assert(
            publicImageCache.includes('max-age=604800'),
            'Imagem pública sem política de cache esperada',
          )
          assert(
            publicImageCache.includes('stale-while-revalidate=86400'),
            'Imagem pública sem stale-while-revalidate esperado',
          )

          const home = await get('/')
          assert(home.ok, 'Home não respondeu 2xx')
          const homeBody = await home.text()

          assert(
            /<link[^>]+rel="canonical"[^>]+href="https:\/\/example\.com\/?"/i.test(homeBody)
              || /<link[^>]+href="https:\/\/example\.com\/? "[^>]+rel="canonical"/i.test(homeBody)
              || (homeBody.includes('rel="canonical"') && homeBody.includes('https://example.com')),
            'Home sem canonical público válido',
          )

          for (const schemaType of ['Organization','WebSite','SoftwareApplication','FAQPage']) {
            assert(
              homeBody.includes(schemaType),
              'JSON-LD ausente para ' + schemaType,
            )
          }

          const requiredHomeHeaders = {
            'x-content-type-options':'nosniff',
            'x-frame-options':'DENY',
            'referrer-policy':'strict-origin-when-cross-origin',
          }

          for (const [name,value] of Object.entries(requiredHomeHeaders)) {
            const actual = home.headers.get(name)
            console.log(name + ': ' + actual)
            assert(actual?.toLowerCase() === value.toLowerCase(), 'Header ausente/incorreto: ' + name)
          }

          const csp = home.headers.get('content-security-policy-report-only')
          console.log('content-security-policy-report-only: ' + csp)
          assert(csp && csp.includes("default-src 'self'"), 'CSP Report-Only ausente')

          const login = await get('/login')
          const robotsHeader = login.headers.get('x-robots-tag')
          console.log('x-robots-tag (/login): ' + robotsHeader)
          assert(
            robotsHeader?.toLowerCase().includes('noindex'),
            'Área de login sem X-Robots-Tag noindex',
          )

          const loginCache = login.headers.get('cache-control')
          console.log('cache-control (/login): ' + loginCache)
          assert(
            loginCache?.toLowerCase().includes('no-store'),
            'Área de login pode ser armazenada em cache',
          )

          console.log('SMOKE_TEST_OK')
          NODE

      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/chamaentrega-next.pid ]; then
            kill "$(cat /tmp/chamaentrega-next.pid)" 2>/dev/null || true
          fi
