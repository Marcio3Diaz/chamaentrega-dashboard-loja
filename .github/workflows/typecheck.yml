name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Security audit
        run: npm audit --audit-level=high

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Start production server
        shell: bash
        run: |
          npm run start > /tmp/chamaentrega-next.log 2>&1 &
          echo $! > /tmp/chamaentrega-next.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/chamaentrega-next.log
          exit 1

      - name: Smoke test production server
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const assert = (condition, message) => {
            if (!condition) throw new Error(message)
          }

          const get = async (path) => {
            const response = await fetch('http://127.0.0.1:3000' + path, { redirect:'manual' })
            return response
          }

          const health = await get('/api/health')
          assert(health.ok, 'Healthcheck não respondeu 2xx')
          const healthBody = await health.json()
          assert(healthBody.status === 'ok', 'Healthcheck retornou status inesperado')

          const robots = await get('/robots.txt')
          assert(robots.ok, 'robots.txt indisponível')
          assert((await robots.text()).includes('Sitemap:'), 'robots.txt sem Sitemap')

          const sitemap = await get('/sitemap.xml')
          assert(sitemap.ok, 'sitemap.xml indisponível')
          assert((await sitemap.text()).includes('<urlset'), 'sitemap.xml inválido')

          const home = await get('/')
          assert(home.ok, 'Home não respondeu 2xx')

          const requiredHomeHeaders = {
            'x-content-type-options':'nosniff',
            'x-frame-options':'DENY',
            'referrer-policy':'strict-origin-when-cross-origin',
          }

          for (const [name,value] of Object.entries(requiredHomeHeaders)) {
            const actual = home.headers.get(name)
            console.log(name + ': ' + actual)
            assert(actual?.toLowerCase() === value.toLowerCase(), 'Header ausente/incorreto: ' + name)
          }

          const csp = home.headers.get('content-security-policy-report-only')
          console.log('content-security-policy-report-only: ' + csp)
          assert(csp && csp.includes("default-src 'self'"), 'CSP Report-Only ausente')

          const login = await get('/login')
          const robotsHeader = login.headers.get('x-robots-tag')
          console.log('x-robots-tag (/login): ' + robotsHeader)
          assert(
            robotsHeader?.toLowerCase().includes('noindex'),
            'Área de login sem X-Robots-Tag noindex',
          )

          const loginCache = login.headers.get('cache-control')
          console.log('cache-control (/login): ' + loginCache)
          assert(
            loginCache?.toLowerCase().includes('no-store'),
            'Área de login pode ser armazenada em cache',
          )

          console.log('SMOKE_TEST_OK')
          NODE

      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/chamaentrega-next.pid ]; then
            kill "$(cat /tmp/chamaentrega-next.pid)" 2>/dev/null || true
          fi
