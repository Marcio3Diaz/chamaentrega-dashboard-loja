name: Lighthouse audit

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/**'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'lighthouserc.cjs'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Build
        run: npm run build

      - name: Audit home with Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Print Lighthouse scores
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const dir = '.lighthouseci'
          const files = fs.readdirSync(dir).filter(name => name.endsWith('.json'))

          const reports = []
          for (const name of files) {
            try {
              const data = JSON.parse(fs.readFileSync(path.join(dir,name),'utf8'))
              if (data.categories && data.audits) reports.push(data)
            } catch {}
          }

          if (!reports.length) {
            console.log('LIGHTHOUSE_SUMMARY unavailable')
            process.exit(0)
          }

          const median = values => {
            const sorted = [...values].sort((a,b) => a-b)
            const mid = Math.floor(sorted.length / 2)
            return sorted.length % 2
              ? sorted[mid]
              : (sorted[mid - 1] + sorted[mid]) / 2
          }

          const pct = (report,key) => Math.round((report.categories[key]?.score ?? 0) * 100)
          const metric = (report,key) => report.audits[key]?.numericValue ?? 0

          const summaries = reports.map(report => ({
            report,
            performance:pct(report,'performance'),
            accessibility:pct(report,'accessibility'),
            bestPractices:pct(report,'best-practices'),
            seo:pct(report,'seo'),
            fcp:metric(report,'first-contentful-paint'),
            lcp:metric(report,'largest-contentful-paint'),
            tbt:metric(report,'total-blocking-time'),
            speedIndex:metric(report,'speed-index'),
            cls:metric(report,'cumulative-layout-shift'),
          }))

          const representative = [...summaries].sort(
            (a,b) => Math.abs(a.performance - median(summaries.map(x => x.performance)))
              - Math.abs(b.performance - median(summaries.map(x => x.performance)))
          )[0]

          console.log('LIGHTHOUSE_SUMMARY')
          console.log('runs=' + summaries.length)
          console.log('performance=' + Math.round(median(summaries.map(x => x.performance))))
          console.log('accessibility=' + Math.round(median(summaries.map(x => x.accessibility))))
          console.log('best_practices=' + Math.round(median(summaries.map(x => x.bestPractices))))
          console.log('seo=' + Math.round(median(summaries.map(x => x.seo))))
          console.log('fcp_ms=' + Math.round(median(summaries.map(x => x.fcp))))
          console.log('lcp_ms=' + Math.round(median(summaries.map(x => x.lcp))))
          console.log('tbt_ms=' + Math.round(median(summaries.map(x => x.tbt))))
          console.log('speed_index_ms=' + Math.round(median(summaries.map(x => x.speedIndex))))
          console.log('cls=' + median(summaries.map(x => x.cls)).toFixed(3))

          for (const categoryId of ['seo','best-practices','performance','accessibility']) {
            const refs = representative.report.categories[categoryId]?.auditRefs ?? []
            const failed = refs
              .map(ref => representative.report.audits[ref.id])
              .filter(audit =>
                audit
                && audit.scoreDisplayMode !== 'notApplicable'
                && audit.score != null
                && audit.score < 1
              )
              .map(audit => audit.id + ':' + audit.title.replace(/\s+/g,' ').trim())

            if (failed.length) {
              console.log('LIGHTHOUSE_ISSUES_' + categoryId.toUpperCase().replace('-','_'))
              failed.forEach(item => console.log('- ' + item))
            }
          }
          NODE

      - name: Upload Lighthouse raw report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
