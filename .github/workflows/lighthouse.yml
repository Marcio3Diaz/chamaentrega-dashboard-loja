name: Lighthouse audit

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/**'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'lighthouserc.cjs'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Build
        run: npm run build

      - name: Audit home with Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Print Lighthouse scores
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const dir = '.lighthouseci'
          const files = fs.readdirSync(dir).filter(name => name.endsWith('.json'))

          let report = null
          for (const name of files) {
            try {
              const data = JSON.parse(fs.readFileSync(path.join(dir,name),'utf8'))
              if (data.categories && data.audits) {
                report = data
                break
              }
            } catch {}
          }

          if (!report) {
            console.log('LIGHTHOUSE_SUMMARY unavailable')
            process.exit(0)
          }

          const pct = key => Math.round((report.categories[key]?.score ?? 0) * 100)
          const ms = key => Math.round(report.audits[key]?.numericValue ?? 0)
          const cls = report.audits['cumulative-layout-shift']?.numericValue ?? 0

          console.log('LIGHTHOUSE_SUMMARY')
          console.log('performance=' + pct('performance'))
          console.log('accessibility=' + pct('accessibility'))
          console.log('best_practices=' + pct('best-practices'))
          console.log('seo=' + pct('seo'))
          console.log('fcp_ms=' + ms('first-contentful-paint'))
          console.log('lcp_ms=' + ms('largest-contentful-paint'))
          console.log('tbt_ms=' + ms('total-blocking-time'))
          console.log('speed_index_ms=' + ms('speed-index'))
          console.log('cls=' + cls.toFixed(3))
          NODE

      - name: Upload Lighthouse raw report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 7
