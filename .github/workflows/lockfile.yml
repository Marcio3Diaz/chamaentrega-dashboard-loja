name: Lockfile guard

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lockfile.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lockfile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require package-lock.json
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json é obrigatório."
            exit 1
          fi

          node -e "
            const pkg=require('./package.json');
            const lock=require('./package-lock.json');
            if (lock.name !== pkg.name) {
              throw new Error('package-lock.json não corresponde ao package.json');
            }
            if (!lock.lockfileVersion || lock.lockfileVersion < 3) {
              throw new Error('Use lockfileVersion 3 ou superior');
            }
          "
