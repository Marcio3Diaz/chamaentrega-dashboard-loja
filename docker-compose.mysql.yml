services:
  mysql:
    image: mysql:8.4
    container_name: chamaentrega-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: chamaentrega_root
      MYSQL_DATABASE: chamaentrega
      MYSQL_USER: chamaentrega
      MYSQL_PASSWORD: chamaentrega_dev
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - chamaentrega_mysql_data:/var/lib/mysql
      - ./mysql/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
      - ./mysql/002_align_store_members.sql:/docker-entrypoint-initdb.d/002_align_store_members.sql:ro
      - ./mysql/003_align_supabase_core_fields.sql:/docker-entrypoint-initdb.d/003_align_supabase_core_fields.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uchamaentrega -pchamaentrega_dev --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  chamaentrega_mysql_data:
